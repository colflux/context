site_name: Colflux
site_description: Documentación transversal del proyecto Colflux (OE2 - Plataforma de monitoreo de carbono)
copyright: 🌿 COLFLUX
theme:
  name: material
  language: es
  logo: assets/banner.png
  favicon: assets/favicon.png
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  font:
    text: Inter
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - search.suggest
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mermaid-zoom.js

nav:
  - Ir a Plataforma: http://44.213.47.34/mapas
  - Inicio:
      - index.md
      - Gestión: gestion/index.md
      - Roadmap:
          - roadmap/index.md
          - roadmap/roadmap-3-6-12-meses.md
          - roadmap/funcionalidades-addendum.md
      - Institucional: institucional/index.md
      - Marca:
          - marca/index.md
          - marca/prompt-ia.md
  - Tecnología:
      - Requisitos: requisitos/index.md
      - Arquitectura:
          - arquitectura/index.md
          - arquitectura/repositorios.md
          - arquitectura/diagrama-c4.md
          - arquitectura/git-flow.md
          - arquitectura/guia-desarrollo-local.md
      - Conceptos:
          - conceptos/index.md
          - conceptos/arquitectura.md
          - conceptos/buenos-requerimientos.md
          - conceptos/devops.md
  - Conocimiento:
      - conocimiento/index.md
      - conocimiento/como-se-mide-el-carbono.md
  - Social:
      - social/index.md
      - social/encuentros.md
      - social/noticias.md
      - social/blog-y-reflexiones.md
  - FAQ: faq/index.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  generator: false
  homepage: http://44.213.47.34/mapas
