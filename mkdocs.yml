site_name: Colflux
site_description: Documentación transversal del proyecto Colflux (OE2 - Plataforma de monitoreo de carbono)
copyright: 🌿 COLFLUX
theme:
  name: material
  language: es
  logo: assets/banner.png
  favicon: assets/favicon.png
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  font:
    text: Inter
  features:
    - navigation.tabs
    - navigation.indexes
    - search.suggest
    - content.code.copy

extra_css:
  - stylesheets/extra.css
  - stylesheets/noticias.css

extra_javascript:
  - javascripts/mermaid-zoom.js
  - javascripts/galeria-territorios.js

